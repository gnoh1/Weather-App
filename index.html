<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <!-- Import icons -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>Weather App</title>
  </head>
  <body>
    <main class="main-container">
      <header class="input-container">
        <input type="text" class="input-city" placeholder="Search City" />
        <button class="search-btn">
          <i class="bx bx-search"></i>
        </button>

        <!-- /* Menu button */ -->
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="dropdown-menu" id="dropdownMenu">
          <a href="#" class="dropdown-item" onclick="return false;">
            <i class="bx bx-phone"></i>
            <span>Liên Hệ</span>
          </a>
          <a
            href="mailto:phamthong0819@email.com"
            class="dropdown-item"
            onclick="return true;"
          >
            <i class="bx bx-info-circle"></i>
            <span>About</span>
          </a>
          <a
            href="labthuchanh.html"
            class="dropdown-item"
            onclick="return true;"
          >
            <i class="bx bx-flask"></i>
            <span>LAB THUC HANH</span>
          </a>
        </div>
        <!-- /* Menu button */ -->
      </header>

      <section class="weather-info" style="display: none">
        <div class="location-date-container">
          <div class="location">
            <i class="bx bx-map"></i>
            <h4 class="country-txt">Ha Noi</h4>
          </div>
          <h5 class="current-date-txt regular">Fri, 08 Aug</h5>
        </div>

        <div class="weather-summary-container">
          <img
            src="./assets/weather/clouds.svg"
            alt="clouds"
            class="weather-summary-img"
          />
          <div class="weather-summary-info">
            <h1 class="temp-txt">28 °C</h1>
            <h3 class="condition-txt regular">Nhiều Mây</h3>
          </div>
        </div>

        <div class="weather-conditions-container">
          <div class="condition-item">
            <i class="bx bx-droplet"></i>
            <div class="condition-info">
              <h5 class="regular">Độ ẩm</h5>
              <h5 class="humidity-value-txt">55%</h5>
            </div>
          </div>

          <div class="condition-item">
            <i class="bx bx-wind"></i>
            <div class="condition-info">
              <h5 class="regular">Tốc độ gió</h5>
              <h5 class="wind-value-txt">2 M/s</h5>
            </div>
          </div>
        </div>

        <div class="forecast-items-container">
          <div class="forecast-item">
            <h5 class="forecast-item-date regular">19 Aug</h5>
            <img
              src="./assets/weather/thunderstorm.svg"
              class="forecast-item-img"
            />
            <h5 class="forecast-item-temp">28 °C</h5>
          </div>
          <div class="forecast-item">
            <h5 class="forecast-item-date regular">19 Aug</h5>
            <img
              src="./assets/weather/thunderstorm.svg"
              class="forecast-item-img"
            />
            <h5 class="forecast-item-temp">28 °C</h5>
          </div>
          <div class="forecast-item">
            <h5 class="forecast-item-date regular">19 Aug</h5>
            <img
              src="./assets/weather/thunderstorm.svg"
              class="forecast-item-img"
            />
            <h5 class="forecast-item-temp">28 °C</h5>
          </div>
          <div class="forecast-item">
            <h5 class="forecast-item-date regular">19 Aug</h5>
            <img
              src="./assets/weather/thunderstorm.svg"
              class="forecast-item-img"
            />
            <h5 class="forecast-item-temp">28 °C</h5>
          </div>
        </div>
      </section>

      <section class="search-city section-message">
        <img src="./assets/message/search-city.png" class="message-img" />
        <div>
          <h1>Tìm Kiếm Thành Phố</h1>
          <h4 class="regular">Điều kiện thời tiết của thành phố</h4>
        </div>
      </section>

      <section class="not-found-city section-message" style="display: none">
        <img src="./assets/message/not-found.png" />
        <div>
          <h1>Search City</h1>
          <h4 class="regular">Điều kiện thời tiết của thành phố</h4>
        </div>
      </section>
    </main>
  </body>
</html>
